name: iOS build & test

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test & screenshot
    # macOS runners are free for public repositories.
    # Xcode 27 image (macOS 27): the app uses SDK APIs newer than Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 45
    # Write access only so the screenshots can be pushed to the ci-screenshots branch and shown on the pull request.
    permissions:
      contents: write
      pull-requests: write

    env:
      PROJECT: app/dime.xcodeproj
      SCHEME: dime
      DERIVED_DATA: build
      BUNDLE_ID: com.rafaelsoh.dime

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        # Use the newest stable Xcode on the image.
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('app/dime.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick an iPhone simulator
        run: |
          # Newest available iOS runtime, first iPhone on it. Avoids hardcoding device names
          # that change whenever GitHub updates the runner image.
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          def version(key):
              # e.g. com.apple.CoreSimulator.SimRuntime.iOS-27-2 (some images add suffixes)
              m = re.search(r"\.iOS-(\d+)-(\d+)", key)
              return (int(m.group(1)), int(m.group(2))) if m else None
          ios = sorted((k for k in data if version(k)), key=version)
          for runtime in reversed(ios):
              phones = [d for d in data[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          if [ -z "$UDID" ]; then echo "No iPhone simulator found"; exit 1; fi
          xcrun simctl list devices | grep "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          # A regular iPhone on the same runtime, for pull requests that ask for screenshots on both
          # (the first iPhone is usually the iPhone Duo).
          OTHER=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          udid = sys.argv[1]
          for devices in json.load(sys.stdin)["devices"].values():
              if any(d["udid"] == udid for d in devices):
                  others = [d for d in devices if d["name"].startswith("iPhone") and "Duo" not in d["name"] and d["udid"] != udid]
                  pro = [d for d in others if "Pro" in d["name"] and "Max" not in d["name"]]
                  if others:
                      print((pro or others)[0]["udid"])
                  break
          ' "$UDID")
          if [ -z "$OTHER" ]; then
            # The runtime may only come with the Duo: create a regular iPhone on it, trying the
            # newest device types first until the runtime accepts one.
            RUNTIME=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if any(d["udid"] == sys.argv[1] for d in devices):
                  print(runtime)
          ' "$UDID")
            TYPES=$(xcrun simctl list devicetypes --json | python3 -c '
          import json, sys
          types = [t for t in json.load(sys.stdin)["devicetypes"] if t["name"].startswith("iPhone") and "Duo" not in t["name"]]
          pro = [t for t in types if "Pro" in t["name"] and "Max" not in t["name"]]
          for t in list(reversed(pro)) + list(reversed(types)):
              print(t["identifier"])
          ')
            echo "Runtime $RUNTIME; candidate device types: $(echo $TYPES | head -c 400)"
            for TYPE in $TYPES; do
              if OTHER=$(xcrun simctl create "Screenshots iPhone" "$TYPE" "$RUNTIME" 2>/dev/null); then
                echo "Created $TYPE"
                break
              fi
              OTHER=""
            done
          fi
          if [ -n "$OTHER" ]; then
            xcrun simctl list devices | grep "$OTHER"
            echo "SIM_OTHER_UDID=$OTHER" >> "$GITHUB_ENV"
          fi
          # Start it now, so it boots while the app builds instead of when the tests start.
          xcrun simctl boot "$UDID" || true

      - name: Build and run tests
        run: |
          status=0
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 || status=$?
          # Print a readable summary; the full log is uploaded if the job fails.
          grep -E "error:|Test Suite|Test Case.*(passed|failed)|\*\* (BUILD|TEST)" xcodebuild.log || true
          if [ "$status" -ne 0 ]; then tail -80 xcodebuild.log; fi
          exit "$status"

      - name: Take the pull request's screenshots
        # Only the screenshots the pull request asks for, in a ```ci-screenshots block in its description
        # (see .github/scripts/pr_screenshots.py). Nothing is committed for them, so they go away with the
        # pull request. Editing the description doesn't rerun CI: push a commit or rerun the job.
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.body, '```ci-screenshots')
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          APP=$(find "$DERIVED_DATA/Build/Products" -maxdepth 2 -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "App: $APP"
          python3 .github/scripts/pr_screenshots.py "$APP" screenshots

      - name: Show screenshots on the pull request
        # Pushes the images to the ci-screenshots branch (one folder per pull request) and keeps one
        # comment on the pull request up to date with them. Skipped for forks, whose token can't write.
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          ls screenshots/*.png > /dev/null 2>&1 || { echo "No screenshots"; exit 0; }
          folder="pr-$PR"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          work=$(mktemp -d)
          if git ls-remote --exit-code "$remote" refs/heads/ci-screenshots > /dev/null; then
            git clone -q --depth 1 --branch ci-screenshots "$remote" "$work"
          else
            git init -q -b ci-screenshots "$work"
            git -C "$work" remote add origin "$remote"
          fi
          rm -rf "${work:?}/$folder"
          mkdir -p "$work/$folder"
          cp screenshots/*.png "$work/$folder/"
          git -C "$work" add -A
          git -C "$work" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots for #$PR at ${HEAD_SHA:0:7}" || true
          git -C "$work" push -q origin ci-screenshots
          commit=$(git -C "$work" rev-parse HEAD)

          python3 - "$work/$folder" "$commit" > comment.md <<'PY'
          import os, sys
          folder, commit = sys.argv[1], sys.argv[2]
          repo, pr, head = os.environ["REPO"], os.environ["PR"], os.environ["HEAD_SHA"]
          def order(name):
              digits = "".join(c for c in name.split("-")[0] if c.isdigit())
              return (int(digits or 0), name)
          names = sorted((n for n in os.listdir(folder) if n.endswith(".png")), key=order)
          print("<!-- ci-screenshots -->")
          print(f"### Screenshots at {head[:7]}\n")
          print("<table>")
          for i in range(0, len(names), 3):
              print("<tr>")
              for name in names[i:i + 3]:
                  url = f"https://raw.githubusercontent.com/{repo}/{commit}/pr-{pr}/{name}"
                  print(f'<td align="center" valign="top"><img src="{url}" width="240"><br><sub>{name[:-4]}</sub></td>')
              print("</tr>")
          print("</table>")
          PY

          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- ci-screenshots -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

      - name: Upload logs and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            TestResults.xcresult
          if-no-files-found: ignore
