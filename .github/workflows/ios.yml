name: iOS build & test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test & screenshot
    # macOS runners are free for public repositories.
    # Xcode 27 image (macOS 27): the app uses SDK APIs newer than Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 45
    # Write access only so the screenshots can be pushed to the ci-screenshots branch and shown on the pull request.
    permissions:
      contents: write
      pull-requests: write

    env:
      PROJECT: app/dime.xcodeproj
      SCHEME: dime
      DERIVED_DATA: build
      BUNDLE_ID: com.rafaelsoh.dime

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        # Use the newest stable Xcode on the image.
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('app/dime.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick an iPhone simulator
        run: |
          # Newest available iOS runtime, first iPhone on it. Avoids hardcoding device names
          # that change whenever GitHub updates the runner image.
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          def version(key):
              # e.g. com.apple.CoreSimulator.SimRuntime.iOS-27-2 (some images add suffixes)
              m = re.search(r"\.iOS-(\d+)-(\d+)", key)
              return (int(m.group(1)), int(m.group(2))) if m else None
          ios = sorted((k for k in data if version(k)), key=version)
          for runtime in reversed(ios):
              phones = [d for d in data[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          if [ -z "$UDID" ]; then echo "No iPhone simulator found"; exit 1; fi
          xcrun simctl list devices | grep "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and run tests
        run: |
          status=0
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 || status=$?
          # Print a readable summary; the full log is uploaded if the job fails.
          grep -E "error:|Test Suite|Test Case.*(passed|failed)|\*\* (BUILD|TEST)" xcodebuild.log || true
          if [ "$status" -ne 0 ]; then tail -80 xcodebuild.log; fi
          exit "$status"

      - name: Launch app and take screenshots
        # Smoke check: the app starts, and the dimeapp://newExpense link (used by the
        # New Expense widget and control) opens the add sheet.
        continue-on-error: true
        run: |
          mkdir -p screenshots
          # Newer simulator images list more than one display, and only one of them shows the app;
          # take each and keep the largest file, since the others are blank.
          snap() {
            if ! err=$(xcrun simctl io "$SIM_UDID" screenshot "$1" 2>&1); then
              for d in $(echo "$err" | grep -o -- '--display=[0-9]*' | cut -d= -f2); do
                xcrun simctl io "$SIM_UDID" screenshot --display="$d" "${1%.png}-display$d.png" || true
              done
              best=$(ls -S "${1%.png}"-display*.png 2>/dev/null | head -1)
              if [ -n "$best" ]; then mv "$best" "$1"; fi
              rm -f "${1%.png}"-display*.png
            fi
          }
          APP=$(find "$DERIVED_DATA/Build/Products" -maxdepth 2 -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "App: $APP"
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 8
          snap screenshots/1-launch.png
          xcrun simctl openurl "$SIM_UDID" "dimeapp://newExpense"
          sleep 4
          snap screenshots/2-new-expense.png

      - name: Take budget rollover screenshots
        # Relaunches against the seeded `-demoData varied` store (in memory, so every launch starts
        # from the same data): Overall and Food roll over a surplus, Coffee an overspend, Groceries doesn't roll over.
        continue-on-error: true
        run: |
          mkdir -p screenshots
          # Newer simulator images list more than one display, and only one of them shows the app;
          # take each and keep the largest file, since the others are blank.
          snap() {
            if ! err=$(xcrun simctl io "$SIM_UDID" screenshot "$1" 2>&1); then
              for d in $(echo "$err" | grep -o -- '--display=[0-9]*' | cut -d= -f2); do
                xcrun simctl io "$SIM_UDID" screenshot --display="$d" "${1%.png}-display$d.png" || true
              done
              best=$(ls -S "${1%.png}"-display*.png 2>/dev/null | head -1)
              if [ -n "$best" ]; then mv "$best" "$1"; fi
              rm -f "${1%.png}"-display*.png
            fi
          }
          # The launch step's dimeapp:// link leaves an "Open in Dime?" prompt on screen; a reboot clears it.
          xcrun simctl shutdown "$SIM_UDID" || true
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
          shot() {
            name=$1; shift
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true
            # The budget arguments start on the Budget tab; dimeapp:// links would stop at an "Open in Dime?" prompt.
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -demoData varied "$@"
            sleep 9
            snap "screenshots/$name.png"
          }
          shot 3-budgets -budgetTab
          shot 4-rollover-detail-surplus -budgetSheet Food
          shot 5-rollover-detail-overspend -budgetSheet Coffee
          shot 6-rollover-detail-overall -budgetSheet overall
          shot 7-rollover-edit-sentence -budgetEdit Food
          shot 8-rollover-edit-menu -budgetEdit Food -budgetEditStep rolloverMenu
          shot 9-rollover-alert-turn-on -budgetEdit Groceries -budgetEditStep enableRollover
          shot 10-rollover-alert-turn-off -budgetEdit Food -budgetEditStep disableRollover
          shot 11-rollover-alert-reset -budgetEdit Food -budgetEditStep changeFrequency
          shot 12-rollover-new-budget -budgetEdit new

      - name: Take accounts screenshots
        # The `-demoData varied` store has Card, Cash and Savings accounts, monthly transfers into Savings
        # and a transfer into Cash this morning.
        continue-on-error: true
        run: |
          mkdir -p screenshots
          snap() {
            if ! err=$(xcrun simctl io "$SIM_UDID" screenshot "$1" 2>&1); then
              for d in $(echo "$err" | grep -o -- '--display=[0-9]*' | cut -d= -f2); do
                xcrun simctl io "$SIM_UDID" screenshot --display="$d" "${1%.png}-display$d.png" || true
              done
              best=$(ls -S "${1%.png}"-display*.png 2>/dev/null | head -1)
              if [ -n "$best" ]; then mv "$best" "$1"; fi
              rm -f "${1%.png}"-display*.png
            fi
          }
          shot() {
            name=$1; shift
            xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -demoData varied "$@"
            sleep 9
            snap "screenshots/$name.png"
          }
          shot 13-accounts-log
          shot 14-accounts-log-card -logAccount Card
          shot 15-accounts-log-savings -logAccount Savings
          shot 16-accounts-entry -newEntry -entryKind expense
          shot 17-accounts-entry-picker -newEntry -entryKind expense -entrySheet account
          shot 18-accounts-entry-transfer -newEntry -entryKind transfer
          shot 19-accounts-insights -insightsTab -insightsAccount all
          shot 20-accounts-insights-breakdown -insightsTab -insightsAccount all -insightsScroll accounts
          shot 21-accounts-insights-card -insightsAccount Card
          shot 22-accounts-settings -accountsScreen settings
          shot 23-accounts-onboarding -accountsScreen welcome
          shot 24-accounts-budget-edit -budgetEdit overall
          shot 25-accounts-budget-picker -budgetEdit overall -budgetEditStep accounts

      - name: Show screenshots on the pull request
        # Pushes the images to the ci-screenshots branch (one folder per pull request) and keeps one
        # comment on the pull request up to date with them. Skipped for forks, whose token can't write.
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          ls screenshots/*.png > /dev/null 2>&1 || { echo "No screenshots"; exit 0; }
          folder="pr-$PR"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          work=$(mktemp -d)
          if git ls-remote --exit-code "$remote" refs/heads/ci-screenshots > /dev/null; then
            git clone -q --depth 1 --branch ci-screenshots "$remote" "$work"
          else
            git init -q -b ci-screenshots "$work"
            git -C "$work" remote add origin "$remote"
          fi
          rm -rf "${work:?}/$folder"
          mkdir -p "$work/$folder"
          cp screenshots/*.png "$work/$folder/"
          git -C "$work" add -A
          git -C "$work" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots for #$PR at ${HEAD_SHA:0:7}" || true
          git -C "$work" push -q origin ci-screenshots
          commit=$(git -C "$work" rev-parse HEAD)

          python3 - "$work/$folder" "$commit" > comment.md <<'PY'
          import os, sys
          folder, commit = sys.argv[1], sys.argv[2]
          repo, pr, head = os.environ["REPO"], os.environ["PR"], os.environ["HEAD_SHA"]
          def order(name):
              digits = "".join(c for c in name.split("-")[0] if c.isdigit())
              return (int(digits or 0), name)
          names = sorted((n for n in os.listdir(folder) if n.endswith(".png")), key=order)
          print("<!-- ci-screenshots -->")
          print(f"### Screenshots at {head[:7]}\n")
          print("<table>")
          for i in range(0, len(names), 3):
              print("<tr>")
              for name in names[i:i + 3]:
                  url = f"https://raw.githubusercontent.com/{repo}/{commit}/pr-{pr}/{name}"
                  print(f'<td align="center" valign="top"><img src="{url}" width="240"><br><sub>{name[:-4]}</sub></td>')
              print("</tr>")
          print("</table>")
          PY

          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | startswith("<!-- ci-screenshots -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload logs and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            TestResults.xcresult
          if-no-files-found: ignore
