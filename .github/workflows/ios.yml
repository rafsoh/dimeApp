name: iOS build & test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test & screenshot
    # macOS runners are free for public repositories.
    # Xcode 27 image (macOS 27): the app uses SDK APIs newer than Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 45

    env:
      PROJECT: app/dime.xcodeproj
      SCHEME: dime
      DERIVED_DATA: build
      BUNDLE_ID: com.rafaelsoh.dime

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        # Use the newest stable Xcode on the image.
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('app/dime.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick an iPhone simulator
        run: |
          # Newest available iOS runtime, a standard iPhone on it. Avoids hardcoding device names
          # that change whenever GitHub updates the runner image.
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)["devices"]
          def version(key):
              # e.g. com.apple.CoreSimulator.SimRuntime.iOS-27-2 (some images add suffixes)
              m = re.search(r"\.iOS-(\d+)-(\d+)", key)
              return (int(m.group(1)), int(m.group(2))) if m else None
          versions = [version(k) for k in data if version(k)]
          newest = max(versions) if versions else None
          phones = [d for k in data if version(k) == newest for d in data[k]
                    if d["name"].startswith("iPhone")]
          # Prefer a standard single-screen iPhone (e.g. "iPhone 18 Pro") over foldables.
          phones.sort(key=lambda d: not re.fullmatch(r"iPhone \d+( Pro)?", d["name"]))
          if phones:
              print(phones[0]["udid"])
          ')
          if [ -z "$UDID" ]; then echo "No iPhone simulator found"; exit 1; fi
          xcrun simctl list devices | grep "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build and run tests
        run: |
          status=0
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 || status=$?
          # Print a readable summary; the full log is uploaded if the job fails.
          grep -E "error:|Test Suite|Test Case.*(passed|failed)|\*\* (BUILD|TEST)" xcodebuild.log || true
          if [ "$status" -ne 0 ]; then tail -80 xcodebuild.log; fi
          exit "$status"

      - name: Launch app and take screenshots
        # Smoke check: the app starts, and the dimeapp://newExpense link (used by the
        # New Expense widget and control) opens the add sheet.
        continue-on-error: true
        run: |
          mkdir -p screenshots
          APP=$(find "$DERIVED_DATA/Build/Products" -maxdepth 2 -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "App: $APP"
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$APP"
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 8
          shot() {
            # Foldable simulators have two displays; fall back to the primary one.
            xcrun simctl io "$SIM_UDID" screenshot "$1" 2>/dev/null \
              || xcrun simctl io "$SIM_UDID" screenshot --display=1 "$1"
          }
          shot screenshots/1-launch.png
          xcrun simctl openurl "$SIM_UDID" "dimeapp://newExpense"
          sleep 4
          shot screenshots/2-new-expense.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      - name: Upload logs and test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            TestResults.xcresult
          if-no-files-found: ignore
